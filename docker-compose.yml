services:
  # MCP server:
  #   - streamable HTTP: http://127.0.0.1:8586/mcp
  #   - SSE:             http://127.0.0.1:8586/sse
  #
  # Bound to loopback by default: mcp-proxy has no authentication of any kind, so
  # anyone who can reach this port can read your weight, sleep, blood pressure and
  # ECG data. Reach it from another machine over an SSH tunnel, a VPN, or an
  # authenticating reverse proxy. Setting WITHINGS_MCP_BIND=0.0.0.0 publishes it to
  # every interface — note that Docker's port rules sit in front of ufw/firewalld,
  # so a host firewall will not save you.
  withings-mcp:
    build: .
    image: withings-mcp:latest
    container_name: withings-mcp
    restart: unless-stopped
    ports:
      - "${WITHINGS_MCP_BIND:-127.0.0.1}:${WITHINGS_MCP_PORT:-8586}:8586"
    environment:
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - ${WITHINGS_MCP_CONFIG_HOST:-./config}:/config
      - ${WITHINGS_MCP_DATA_HOST:-./data}:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8586/status', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Interactive OAuth setup (one time only):
  #   docker compose run --rm auth
  # The Withings callback listens on localhost:8585, hence network_mode: host.
  auth:
    build: .
    image: withings-mcp:latest
    profiles: ["setup"]
    network_mode: host
    stdin_open: true
    tty: true
    command: ["withings-mcp", "auth"]
    environment:
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - ${WITHINGS_MCP_CONFIG_HOST:-./config}:/config

  # One-shot sync, for the initial cache fill:
  #   docker compose run --rm sync
  #
  # Run this while the server is STOPPED. Both processes keep their own in-memory
  # copy of the OAuth tokens and Withings rotates the refresh token on every use,
  # so a sync run alongside the running server leaves the server holding a dead
  # refresh token until it is restarted. The server auto-syncs on its own anyway —
  # see the README before scheduling this.
  sync:
    build: .
    image: withings-mcp:latest
    profiles: ["setup"]
    command: ["withings-mcp", "sync", "--days", "${WITHINGS_SYNC_DAYS:-30}"]
    environment:
      - TZ=${TZ:-Europe/Paris}
    volumes:
      - ${WITHINGS_MCP_CONFIG_HOST:-./config}:/config
      - ${WITHINGS_MCP_DATA_HOST:-./data}:/data
